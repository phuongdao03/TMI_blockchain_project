name: THV registry production read-only gate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full immutable commit qualified on Polygon Amoy
        required: true
        type: string

permissions:
  contents: read

jobs:
  polygon-dry-run:
    runs-on: ubuntu-24.04
    environment: production-blockchain
    concurrency:
      group: polygon-production-contract
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_commit }}
      - name: Verify immutable source commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Verify active THV contract and read-only tooling
        run: |
          docker run --rm --entrypoint forge -v "$PWD/contracts:/workspace" -w /workspace ghcr.io/foundry-rs/foundry:v1.7.1 build src/THVProofRegistry.sol --force
          docker run --rm --entrypoint forge -v "$PWD/contracts:/workspace" -w /workspace ghcr.io/foundry-rs/foundry:v1.7.1 test --match-contract THVProofRegistryTest --fuzz-runs 256
          npm --prefix contracts ci
          npm --prefix contracts run test:proof-registry-ops
      - name: Read-only Polygon preflight
        env:
          BLOCKCHAIN_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          THV_PROOF_REGISTRY_CONTRACT_ADDRESS: 0x4B7fFF9e719a55cA3792cF96fbb229611e505b5F
          BLOCKCHAIN_ALLOWED_CONTRACT_ADDRESSES: 0x4B7fFF9e719a55cA3792cF96fbb229611e505b5F
          ADMIN_WALLET_ADDRESS: 0xec5FcdFab3FCafCEFCED55CC702CD3B13f54B4Fe
          SIGNER_WALLET_ADDRESS: 0xBfA38182f0D24589e7898DD4892C58c3FDa58042
          MINIMUM_SIGNER_BALANCE_WEI:
            ${{ vars.POLYGON_MINIMUM_SIGNER_BALANCE_WEI }}
        run: bash infrastructure/scripts/blockchain-preflight.sh
