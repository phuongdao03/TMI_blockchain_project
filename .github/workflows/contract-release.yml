name: Contract production dry run

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full immutable commit qualified on Polygon Amoy
        required: true
        type: string

permissions:
  contents: read

jobs:
  polygon-dry-run:
    runs-on: ubuntu-24.04
    environment: production-blockchain
    concurrency:
      group: polygon-production-contract
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_commit }}
      - name: Verify immutable source commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Verify pinned contract release
        run: |
          docker run --rm --entrypoint forge -v "$PWD/contracts:/workspace" -w /workspace ghcr.io/foundry-rs/foundry:v1.7.1 build --force
          docker run --rm --entrypoint forge -v "$PWD/contracts:/workspace" -w /workspace ghcr.io/foundry-rs/foundry:v1.7.1 test --fuzz-runs 256
          npm --prefix contracts ci
          npm --prefix contracts run test:provenance
      - name: Read-only Polygon preflight
        env:
          BLOCKCHAIN_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          CERTIFICATE_CONTRACT_ADDRESS:
            ${{ secrets.POLYGON_CERTIFICATE_CONTRACT_ADDRESS }}
          BLOCKCHAIN_ALLOWED_CONTRACT_ADDRESSES:
            ${{ secrets.POLYGON_ALLOWED_CONTRACT_ADDRESSES }}
          BLOCKCHAIN_MANAGED_SIGNER_EXPECTED_ADDRESS:
            ${{ secrets.POLYGON_SIGNER_ADDRESS }}
          CONTRACT_ADMIN: ${{ secrets.POLYGON_CONTRACT_ADMIN }}
          ISSUER_ADDRESS: ${{ secrets.POLYGON_ISSUER_ADDRESS }}
          MINIMUM_SIGNER_BALANCE_WEI:
            ${{ vars.POLYGON_MINIMUM_SIGNER_BALANCE_WEI }}
        run: |
          expected_hash="$(node -p 'require("./contracts/artifacts/releases/amoy/manifest.json").bytecode.runtimeSha256')"
          export EXPECTED_RUNTIME_BYTECODE_SHA256="$expected_hash"
          bash infrastructure/scripts/blockchain-preflight.sh
      - name: Record immutable dry-run plan
        env:
          CONTRACT_ADMIN: ${{ secrets.POLYGON_CONTRACT_ADMIN }}
          CONTRACT_DEPLOYER_ADDRESS: ${{ secrets.POLYGON_DEPLOYER_ADDRESS }}
          ISSUER_ADDRESS: ${{ secrets.POLYGON_ISSUER_ADDRESS }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          node contracts/scripts/production-release-plan.mjs \
            --source-commit="$SOURCE_COMMIT" \
            --deployer="$CONTRACT_DEPLOYER_ADDRESS" \
            --administrator="$CONTRACT_ADMIN" \
            --issuer="$ISSUER_ADDRESS"
      - uses: actions/upload-artifact@v4
        with:
          name: polygon-contract-dry-run-${{ inputs.source_commit }}
          path: contracts/artifacts/releases/polygon/dry-run-plan.json
          retention-days: 90
