name: Delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag approved for production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history and working tree
        run: bash infrastructure/scripts/verify-gitleaks.sh

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.13
          cache: pip
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix contracts ci
      - run: python -m pip install --disable-pip-version-check -e "backend[dev]"
      - name: Lint and formatting
        run: |
          npm run format:check
          npm --prefix frontend run lint
          python -m ruff check backend
      - name: Type checks
        run: |
          npm --prefix frontend run typecheck
          cd backend && python -m mypy app
      - name: Unit and integration tests
        run: |
          node --test tests/*.test.mjs
          npm --prefix frontend run test
          python -m pytest backend/app/tests
      - name: Production frontend build
        run: npm --prefix frontend run build
      - name: Dependency security audit
        run: |
          npm audit --audit-level=high
          npm --prefix frontend audit --audit-level=high
          npm --prefix contracts audit --audit-level=high
      - name: Pinned contract tests
        run: |
          docker run --rm --user root --entrypoint forge -v "$PWD/contracts:/workspace" -w /workspace ghcr.io/foundry-rs/foundry:v1.7.1 fmt --check
          docker run --rm --user root --entrypoint forge -v "$PWD/contracts:/workspace" -w /workspace ghcr.io/foundry-rs/foundry:v1.7.1 build --force
          docker run --rm --user root --entrypoint forge -v "$PWD/contracts:/workspace" -w /workspace ghcr.io/foundry-rs/foundry:v1.7.1 test --fuzz-runs 256
          node --test contracts/scripts/export-artifacts.test.mjs
      - name: Anvil contract release smoke
        run: bash contracts/scripts/smoke-anvil.sh
      - uses: actions/upload-artifact@v7
        with:
          name: contract-release-${{ github.run_id }}
          path: |
            contracts/artifacts/releases/local
            contracts/deployments/local.json
          retention-days: 14

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: frontend/node_modules/.bin/playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  public-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.13
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e "backend[dev]"
      - name: Public visibility and leakage release gate
        run: >-
          python -m pytest
          backend/app/tests/test_public_catalog_security_gate.py
          backend/app/tests/test_public_seo.py
          backend/app/tests/test_public_catalog_cache.py
          backend/app/tests/test_public_media_service.py
          backend/app/tests/test_full_text_search_repository.py
          backend/app/tests/test_search_autocomplete.py
          backend/app/tests/test_search_discovery.py

  migration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: tmi_ci
          POSTGRES_USER: tmi_ci
          POSTGRES_PASSWORD: tmi-ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tmi_ci -d tmi_ci" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_DIRECT_URL: postgresql+asyncpg://tmi_ci:tmi-ci-ephemeral-only@localhost:5432/tmi_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.13
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e "backend[dev]"
      - name: Reversible migration gate
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          run_migration_step() {
            local label="$1"
            shift
            local log_file="migration-${label}.log"

            if ! "$@" 2>&1 | tee "$log_file"; then
              local detail
              detail="$(tail -n 30 "$log_file" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/::/%3A%3A/g')"
              echo "::error title=Alembic ${label} failed::${detail}"
              exit 1
            fi
          }

          run_migration_step upgrade-head alembic upgrade head
          run_migration_step downgrade-one alembic downgrade -1
          run_migration_step upgrade-head-again alembic upgrade head

  operational-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.13
          cache: pip
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check -e "backend[dev]"
      - name: Simulated database, Redis and blockchain RPC failure gate
        run: >-
          node infrastructure/scripts/run-operational-readiness-regressions.mjs
          --output operational-readiness-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: operational-readiness-regression-${{ github.run_id }}
          path: operational-readiness-evidence
          retention-days: 14

  document-proof-production-gate:
    name: Document proof production gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.13
          cache: pip
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix contracts ci
      - run: python -m pip install --disable-pip-version-check -e "backend[dev]"
      - run: frontend/node_modules/.bin/playwright install --with-deps chromium
      - name: Run encrypted document proof qualification
        run: >-
          node infrastructure/scripts/run-document-proof-production-gate.mjs
          --output document-proof-production-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: document-proof-production-gate-${{ github.run_id }}
          path: document-proof-production-evidence
          retention-days: 30

  images:
    if: github.event_name == 'push'
    needs:
      [
        secret-scan,
        quality,
        e2e,
        migration,
        operational-readiness,
        public-security,
        document-proof-production-gate,
      ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}"
          --password-stdin
      - name: Build and push immutable images
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          TAG: ${{ github.sha }}
          NEXT_PUBLIC_APP_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_BASE_URL }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:
            ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:
            ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID:
            ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:
            ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:
            ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          for name in NEXT_PUBLIC_APP_BASE_URL NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID NEXT_PUBLIC_FIREBASE_APP_ID; do
            test -n "${!name}" || { echo "Missing GitHub repository variable: $name" >&2; exit 1; }
          done
          docker buildx build --pull --load --platform linux/amd64 --cache-from type=gha,scope=backend --cache-to type=gha,mode=max,scope=backend -t "$REGISTRY/tmi-certificate-backend:$TAG" backend
          docker buildx build --pull --load --platform linux/amd64 --cache-from type=gha,scope=frontend --cache-to type=gha,mode=max,scope=frontend --build-arg NEXT_PUBLIC_RELEASE_MODE=full --build-arg NEXT_PUBLIC_APP_BASE_URL --build-arg NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID --build-arg NEXT_PUBLIC_FIREBASE_API_KEY --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID --build-arg NEXT_PUBLIC_FIREBASE_APP_ID -t "$REGISTRY/tmi-certificate-frontend:$TAG" frontend
          # Firebase Admin synchronization adds the Google Auth runtime. Keep a
          # strict ceiling above the measured production image size (289 MiB).
          bash infrastructure/scripts/check-image-size.sh "$REGISTRY/tmi-certificate-backend:$TAG" 300
          # Next.js standalone output includes the public Firebase runtime bundle.
          bash infrastructure/scripts/check-image-size.sh "$REGISTRY/tmi-certificate-frontend:$TAG" 200
          docker run -d --rm --name tmi-backend-smoke -p 18000:8000 "$REGISTRY/tmi-certificate-backend:$TAG"
          docker run -d --rm --name tmi-frontend-smoke -p 13000:3000 "$REGISTRY/tmi-certificate-frontend:$TAG"
          trap 'docker stop tmi-backend-smoke tmi-frontend-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:18000/health && break; sleep 2; done
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:13000/ && break; sleep 2; done
          curl --fail --silent http://127.0.0.1:18000/health >/dev/null
          curl --fail --silent http://127.0.0.1:13000/ >/dev/null
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.68.2 image --exit-code 1 --severity HIGH,CRITICAL "$REGISTRY/tmi-certificate-backend:$TAG"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.68.2 image --exit-code 1 --severity HIGH,CRITICAL "$REGISTRY/tmi-certificate-frontend:$TAG"
          docker push "$REGISTRY/tmi-certificate-backend:$TAG"
          docker push "$REGISTRY/tmi-certificate-frontend:$TAG"
      - name: Create rollback artifact
        run:
          tar -czf rollback-bundle.tgz infrastructure/compose.production.yaml
          infrastructure/nginx/production.conf.template infrastructure/scripts
      - uses: actions/upload-artifact@v7
        with:
          name: rollback-${{ github.event.inputs.image_tag || github.sha }}
          path: rollback-bundle.tgz
          retention-days: 30

  deploy-staging:
    if: github.event_name == 'push' && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: images
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy immutable staging release
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh_options="-i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          rsync -az -e "ssh $ssh_options" infrastructure/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/tmi_blockchain/infrastructure/"
          rsync -az -e "ssh $ssh_options" contracts/artifacts/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/tmi_blockchain/contracts/artifacts/"
          printf '%s' "$GHCR_PULL_TOKEN" | ssh $ssh_options "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin && cd /var/www/tmi_blockchain && PRODUCTION_ENV_FILE=/var/www/tmi_blockchain/infrastructure/.env.preview bash infrastructure/scripts/deploy.sh '$IMAGE_TAG'"

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}
      - name: Deploy manually approved production release
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh_options="-i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          rsync -az -e "ssh $ssh_options" infrastructure/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/tmi_blockchain/infrastructure/"
          rsync -az -e "ssh $ssh_options" contracts/artifacts/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/tmi_blockchain/contracts/artifacts/"
          printf '%s' "$GHCR_PULL_TOKEN" | ssh $ssh_options "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin && cd /var/www/tmi_blockchain && PRODUCTION_ENV_FILE=/var/www/tmi_blockchain/infrastructure/.env.production bash infrastructure/scripts/deploy.sh '$IMAGE_TAG'"
