[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
