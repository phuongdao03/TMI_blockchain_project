[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tmi-platform-backend"
version = "0.1.0"
description = "Backend for the TMI blockchain certificate platform"
requires-python = "==3.12.13"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "celery==5.6.3",
  "cryptography==50.0.0",
  "email-validator==2.3.0",
  "fastapi==0.139.2",
  "firebase-admin==7.5.0",
  "httpx==0.28.1",
  "Pillow==12.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyJWT==2.13.0",
  "qrcode[pil]==8.2",
  "redis==8.0.1",
  "reportlab==5.0.0",
  "SQLAlchemy==2.0.51",
  "uvicorn[standard]==0.52.0",
  "web3==7.16.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "mypy==2.3.0",
  "PyYAML==6.0.3",
  "pytest==8.4.2",
  "ruff==0.16.0",
  "types-PyYAML==6.0.12.20260518",
  "types-qrcode==8.2.0.20260518",
  "types-reportlab==4.5.1.20260712",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
