x-backend-service: &backend-service
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: runtime
  environment: &backend-environment
    ANVIL_RPC_URL: http://anvil:8545
    APP_ENV: local
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    DATABASE_DIRECT_URL: postgresql+asyncpg://tmi_local:tmi-local-only@postgres:5432/tmi_local
    DATABASE_URL: postgresql+asyncpg://tmi_local:tmi-local-only@postgres:5432/tmi_local
    AUTH_OUTBOX_ENCRYPTION_KEY: ${AUTH_OUTBOX_ENCRYPTION_KEY:-}
    PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
    AUTH_OUTBOX_KEY_ID: ${AUTH_OUTBOX_KEY_ID:-auth-registration-v1}
    AUTH_VERIFICATION_TTL_SECONDS: ${AUTH_VERIFICATION_TTL_SECONDS:-86400}
    AUTH_REGISTRATION_IP_LIMIT: ${AUTH_REGISTRATION_IP_LIMIT:-20}
    AUTH_REGISTRATION_EMAIL_LIMIT: ${AUTH_REGISTRATION_EMAIL_LIMIT:-5}
    AUTH_REGISTRATION_RATE_WINDOW_SECONDS: ${AUTH_REGISTRATION_RATE_WINDOW_SECONDS:-900}
    JWT_SECRET: ${JWT_SECRET:-}
    AUTH_CSRF_SECRET: ${AUTH_CSRF_SECRET:-}
    AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-tmi-platform}
    AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-tmi-web}
    AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-900}
    AUTH_REFRESH_TTL_SECONDS: ${AUTH_REFRESH_TTL_SECONDS:-2592000}
    AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-tmi_access}
    AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-tmi_refresh}
    AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-tmi_csrf}
    AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-20}
    AUTH_LOGIN_EMAIL_LIMIT: ${AUTH_LOGIN_EMAIL_LIMIT:-10}
    AUTH_LOGIN_RATE_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_WINDOW_SECONDS:-900}
    AUTH_PASSWORD_RESET_TTL_SECONDS: ${AUTH_PASSWORD_RESET_TTL_SECONDS:-3600}
    AUTH_PASSWORD_RESET_IP_LIMIT: ${AUTH_PASSWORD_RESET_IP_LIMIT:-10}
    AUTH_PASSWORD_RESET_EMAIL_LIMIT: ${AUTH_PASSWORD_RESET_EMAIL_LIMIT:-3}
    AUTH_PASSWORD_RESET_RATE_WINDOW_SECONDS: ${AUTH_PASSWORD_RESET_RATE_WINDOW_SECONDS:-900}
    FIREBASE_PROJECT_ID: tmi-local
    FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
    FIREBASE_JWKS_URI: ${FIREBASE_JWKS_URI:-https://www.googleapis.com/robot/v1/metadata/x509/securetoken@system.gserviceaccount.com}
    FIREBASE_TIMEOUT_SECONDS: ${FIREBASE_TIMEOUT_SECONDS:-5}
    FIREBASE_TOTP_ENABLED: "false"
    STAFF_MFA_MAX_AGE_SECONDS: ${STAFF_MFA_MAX_AGE_SECONDS:-43200}
    OAUTH_RATE_LIMIT: ${OAUTH_RATE_LIMIT:-10}
    OAUTH_RATE_WINDOW_SECONDS: ${OAUTH_RATE_WINDOW_SECONDS:-60}
    CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
    CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
    CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    MEDIA_SIGNATURE_TTL_SECONDS: ${MEDIA_SIGNATURE_TTL_SECONDS:-3600}
    MEDIA_DELIVERY_TTL_SECONDS: ${MEDIA_DELIVERY_TTL_SECONDS:-300}
    MEDIA_AVATAR_MAX_BYTES: ${MEDIA_AVATAR_MAX_BYTES:-5242880}
    MEDIA_EVIDENCE_MAX_BYTES: ${MEDIA_EVIDENCE_MAX_BYTES:-20971520}
    MEDIA_PROVIDER_TIMEOUT_SECONDS: ${MEDIA_PROVIDER_TIMEOUT_SECONDS:-5}
    MEDIA_SCANNER_HOST: ${MEDIA_SCANNER_HOST:-clamav}
    MEDIA_SCANNER_PORT: ${MEDIA_SCANNER_PORT:-3310}
    MEDIA_SCANNER_TIMEOUT_SECONDS: ${MEDIA_SCANNER_TIMEOUT_SECONDS:-15}
    MEDIA_INSPECTION_MAX_ATTEMPTS: ${MEDIA_INSPECTION_MAX_ATTEMPTS:-5}
    MEDIA_UPLOAD_SIGNATURE_RATE_LIMIT: ${MEDIA_UPLOAD_SIGNATURE_RATE_LIMIT:-20}
    MEDIA_UPLOAD_SIGNATURE_RATE_WINDOW_SECONDS: ${MEDIA_UPLOAD_SIGNATURE_RATE_WINDOW_SECONDS:-60}
    PAYMENT_PROVIDER:
      ${PAYMENT_PROVIDER:?Set PAYMENT_PROVIDER in .env (mock is local-only)}
    PAYMENT_AMOUNT_MINOR: ${PAYMENT_AMOUNT_MINOR:-1000000}
    PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-VND}
    PAYMENT_ORDER_TTL_SECONDS: ${PAYMENT_ORDER_TTL_SECONDS:-900}
    PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
    PAYMENT_WEBHOOK_TOLERANCE_SECONDS: ${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:-300}
    PAYMENT_CHECKOUT_BASE_URL: ${PAYMENT_CHECKOUT_BASE_URL:-http://localhost:3000/payments/mock}
    PAYOS_BASE_URL: ${PAYOS_BASE_URL:-https://api-merchant.payos.vn}
    PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
    PAYOS_API_KEY: ${PAYOS_API_KEY:-}
    PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
    PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-}
    PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-}
    PAYOS_TIMEOUT_SECONDS: ${PAYOS_TIMEOUT_SECONDS:-8}
    PAYMENT_REAL_MONEY_TEST_ENABLED: ${PAYMENT_REAL_MONEY_TEST_ENABLED:-false}
    PAYMENT_REAL_MONEY_TEST_MAX_AMOUNT_VND: ${PAYMENT_REAL_MONEY_TEST_MAX_AMOUNT_VND:-10000}
    BLOCKCHAIN_NETWORK: ${BLOCKCHAIN_NETWORK:-local}
    BLOCKCHAIN_CHAIN_ID: ${BLOCKCHAIN_CHAIN_ID:-31337}
    BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-http://anvil:8545}
    BLOCKCHAIN_ALLOWED_CONTRACT_ADDRESSES: ${BLOCKCHAIN_ALLOWED_CONTRACT_ADDRESSES:-}
    BLOCKCHAIN_CONTRACT_ABI_PATH: /contracts/artifacts/CertificateRegistry.abi.json
    BLOCKCHAIN_REQUIRED_CONFIRMATIONS: ${BLOCKCHAIN_REQUIRED_CONFIRMATIONS:-1}
    BLOCKCHAIN_NONCE_LOCK_TTL_SECONDS: ${BLOCKCHAIN_NONCE_LOCK_TTL_SECONDS:-30}
    BLOCKCHAIN_EXPLORER_BASE_URL: ${BLOCKCHAIN_EXPLORER_BASE_URL:-}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    PUBLIC_RATE_LIMIT: ${PUBLIC_RATE_LIMIT:-120}
    PUBLIC_RATE_WINDOW_SECONDS: ${PUBLIC_RATE_WINDOW_SECONDS:-60}
    PUBLIC_VERIFICATION_CACHE_TTL_SECONDS: ${PUBLIC_VERIFICATION_CACHE_TTL_SECONDS:-30}
    CERTIFICATE_VALIDITY_DAYS: ${CERTIFICATE_VALIDITY_DAYS:-365}
    CERTIFICATE_TEMPLATE_VERSION: ${CERTIFICATE_TEMPLATE_VERSION:-certificate-red-gold-v1}
    ENGAGEMENT_VISITOR_HMAC_SECRET: ${ENGAGEMENT_VISITOR_HMAC_SECRET:-}
    ENGAGEMENT_ACTIVITY_RETENTION_DAYS: ${ENGAGEMENT_ACTIVITY_RETENTION_DAYS:-365}
    SMTP_HOST: mailpit
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_SENDER: ${SMTP_SENDER:-no-reply@tmigroup.vn}
    LOG_LEVEL: INFO
    REDIS_URL: redis://redis:6379/0
  env_file:
    - path: ./.runtime/local-contract.env
      required: false
  networks:
    - application
  read_only: true
  restart: unless-stopped
  tmpfs:
    - /tmp
  user: "10001:10001"
  volumes:
    - ./backend:/app:ro
    - ./contracts/artifacts:/contracts/artifacts:ro

services:
  clamav:
    image: clamav/clamav:1.4.3
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - application
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - clamav_data:/var/lib/clamav

  contract-deps:
    image: node:24.18.0-alpine3.24
    command: ["npm", "ci"]
    profiles: ["tools"]
    user: "1000:1000"
    volumes:
      - ./contracts:/contracts
    working_dir: /contracts

  contract-deployer:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    command:
      - forge
      - script
      - script/DeployCertificateRegistry.s.sol
      - --rpc-url
      - http://anvil:8545
      - --broadcast
      - --unlocked
    depends_on:
      anvil:
        condition: service_healthy
    entrypoint: []
    environment:
      CONTRACT_ADMIN: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      DEPLOYER_ADDRESS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      EXPECTED_DEPLOYER: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      EXPECTED_CONTRACT_ADMIN: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      ISSUER_ADDRESS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      EXPECTED_ISSUER: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
    networks:
      - application
    profiles: ["tools"]
    # Ephemeral tooling writes Foundry build and deployment artifacts to the
    # bind mount. GitHub-hosted workspaces are not writable by the image UID.
    user: root
    volumes:
      - ./contracts:/contracts
    working_dir: /contracts

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tmi_local
      POSTGRES_PASSWORD: tmi-local-only
      POSTGRES_USER: tmi_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmi_local -d tmi_local"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - application
    ports:
      - "5432:5432"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp
      - /var/run/postgresql
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - application
    ports:
      - "1025:1025"
      - "8025:8025"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - mailpit_data:/data

  firebase-emulator:
    build:
      context: ./infrastructure/firebase-emulator
    environment:
      HOME: /tmp/firebase-home
      XDG_CONFIG_HOME: /tmp/firebase
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:9099/emulator/v1/projects/tmi-local/config")
          .then(response => process.exit(response.ok ? 0 : 1)) .catch(() =>
          process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - application
    ports:
      - "9099:9099"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,uid=1000,gid=1000,mode=700

  anvil:
    command:
      - anvil
      - --host
      - 0.0.0.0
    entrypoint: []
    healthcheck:
      test:
        - CMD
        - cast
        - block-number
        - --rpc-url
        - http://127.0.0.1:8545
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    networks:
      - application
    ports:
      - "8545:8545"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp
    user: "1000:1000"

  backend:
    <<: *backend-service
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    depends_on:
      anvil:
        condition: service_healthy
      firebase-emulator:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
      - --webpack
    environment:
      API_BASE_URL: http://backend:8000
      NPM_CONFIG_CACHE: /tmp/npm-cache
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-local-api-key}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-tmi-local.firebaseapp.com}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-tmi-local}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-1:123456789:web:local}
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL: ${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL:-http://localhost:9099}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000").then( response =>
          process.exit(response.ok ? 0 : 1) ).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - application
    ports:
      - "3000:3000"
    profiles:
      - frontend
    read_only: false
    restart: unless-stopped
    tmpfs:
      - /tmp
      - /app/.next:rw,uid=1000,gid=1000,mode=755
    user: "1000:1000"
    volumes:
      - ./frontend/src:/app/src:ro
    working_dir: /app

  nginx:
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/health
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    image: nginxinc/nginx-unprivileged:1.29.4-alpine
    networks:
      - application
    ports:
      - "8080:8080"
    profiles:
      - frontend
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    user: "101:101"
    volumes:
      - ./infrastructure/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    image: redis:8.4.0-alpine
    networks:
      - application
    read_only: true
    restart: unless-stopped
    user: "999:999"
    volumes:
      - redis_data:/data

  migrate:
    <<: *backend-service
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  scheduler:
    <<: *backend-service
    command:
      - celery
      - --app
      - app.workers.celery_app
      - beat
      - --loglevel=INFO
      - --pidfile=/tmp/celerybeat.pid
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /tmp/celerybeat.pid && kill -0 "$$(cat /tmp/celerybeat.pid)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend-service
    environment:
      <<: *backend-environment
      DATABASE_NULL_POOL: "true"
    command:
      - celery
      - --app
      - app.workers.celery_app
      - worker
      - --loglevel=INFO
    depends_on:
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery --app app.workers.celery_app inspect ping --destination
          "celery@$${HOSTNAME}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  application:
    driver: bridge

volumes:
  clamav_data:
  mailpit_data:
  postgres_data:
  redis_data:
